# Names for the functions the Switch code hooks, added to Hell's Gate's manifest by tools/codegen.sh. Addresses are
# Title Update 2's. Each one was found by its body being instruction for instruction the same as the function of
# that name in Dead Space 2's recompiled code (same XDK and RenderWare Audio libraries).

# XDK Direct3D: every shader the game creates (dante_shader_dump.cpp). With the address in the name: the SDK exports
# stubs named __imp__D3DDevice_Create*Shader (xam_misc.cpp), and a bare name made the game's function that stub.
[entrypoint.functions.0x827E8780]
name = "D3DDevice_CreateVertexShader_827E8780"

[entrypoint.functions.0x827E8598]
name = "D3DDevice_CreatePixelShader_827E8598"

# RenderWare Audio's mixer leaves (dante_audio.cpp).
[entrypoint.functions.0x8243D968]
name = "rw__audio__core__MixWithGain"

[entrypoint.functions.0x82435918]
name = "rw__audio__core__CopyWithGain"

# The final compressor of the mix (dante_audio.cpp): not byte for byte DS2's, but the same code with other constant
# and branch addresses (91 of 92 instructions, next to Compressor1's other functions, which match exactly).
[entrypoint.functions.0x824463B8]
name = "rw__audio__core__Compressor1__Process"

